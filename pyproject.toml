[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-address-sorting-engine"
version = "0.1.0a0"
description = "Fully offline, Hongkong Post destination address classifier"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
world-address-engine = "world_address_engine.cli:main"
world-address-engine-gui = "world_address_engine.gui.app:main"

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
gui = ["PySide6>=6.8,<7"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
