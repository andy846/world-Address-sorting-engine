[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-address-sorting-engine"
version = "0.1.0a2"
description = "Fully offline, Hongkong Post destination address classifier"
requires-python = ">=3.12"
dependencies = ["opencc-python-reimplemented==0.1.7"]

[project.scripts]
world-address-engine = "world_address_engine.cli:main"
world-address-engine-gui = "world_address_engine.gui.app:main"

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
gui = ["PySide6>=6.8,<7"]
packaging = ["pyinstaller>=6,<7"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"world_address_engine.resources" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
