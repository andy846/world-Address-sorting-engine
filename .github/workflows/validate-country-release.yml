name: Country Code analysis release validation

on:
  push:
    branches: [feat/country-code-analysis]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: country-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  linux-real-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[excel,packaging,test]"
      - name: Download preserved real reference data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download geonames-packs-2026-10-22-k2 --dir downloaded-packs
          (cd downloaded-packs && sha256sum -c SHA256SUMS.txt)
      - name: Stage and install both verified k2 packs
        run: |
          set -euo pipefail
          mkdir -p builds/real-2026-10-23/pack \
            builds/real-2026-10-22/compact builds/real-2026-10-22/extended \
            builds/real-2026-10-22/report/geonames-built builds/real-2026-10-22/packs
          unzip -q downloaded-packs/compact_global.sqlite.zip -d builds/real-2026-10-23/pack
          unzip -q downloaded-packs/extended_global.sqlite.zip -d builds/real-2026-10-23/pack
          printf '%s  %s\n' \
            f4ef044e94aa3d206f8fce1fa3e0d7ab5f03d6081d142fd7f9e8cf5837ab1b3f \
            builds/real-2026-10-23/pack/compact_global.sqlite | sha256sum -c -
          printf '%s  %s\n' \
            70d617a532b8faedd7d9703c9b952945f101334907df5936725123d20be1f70f \
            builds/real-2026-10-23/pack/extended_global.sqlite | sha256sum -c -
          cp downloaded-packs/build_report.json builds/real-2026-10-23/pack/
          cp downloaded-packs/*.sqlite.zip builds/real-2026-10-23/pack/
          cp downloaded-packs/build_report.json builds/real-2026-10-22/report/geonames-built/
          cp downloaded-packs/*.sqlite.zip builds/real-2026-10-22/packs/
          ln builds/real-2026-10-23/pack/compact_global.sqlite builds/real-2026-10-22/compact/compact_global.sqlite
          ln builds/real-2026-10-23/pack/extended_global.sqlite builds/real-2026-10-22/extended/extended_global.sqlite
          python tools/install_reference_pack.py --database builds/real-2026-10-23/pack/compact_global.sqlite --manifest downloaded-packs/compact_global.manifest.json --active-root packs
          python tools/install_reference_pack.py --database builds/real-2026-10-23/pack/extended_global.sqlite --manifest downloaded-packs/extended_global.manifest.json --active-root packs
      - name: Full regression with real packs
        env:
          WASE_PACK_GENERATION: 2026-10-22-k2
          WASE_SLOW_CHECKS: '1'
        run: python -m pytest -q
      - run: python -m compileall -q src tools
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify the installed wheel and bundled country profile
        run: |
          python -m venv /tmp/country-wheel-smoke
          /tmp/country-wheel-smoke/bin/python -m pip install dist/world_address_sorting_engine-*.whl
          cd /tmp
          /tmp/country-wheel-smoke/bin/python - <<'PY'
          import world_address_engine
          from world_address_engine.data.country_codes import load_country_codes
          from world_address_engine.matching.normalize import _converter
          profile = load_country_codes()
          assert world_address_engine.__version__ == '0.1.0a2'
          assert len(profile.entries) == 235 and 'CNS' not in profile.entries
          assert profile.geo_to_code['XK'] == 'XO'
          assert _converter('t2s') is not None
          PY
          /tmp/country-wheel-smoke/bin/world-address-engine analyze --help
      - uses: actions/upload-artifact@v4
        with:
          name: country-analysis-wheel
          path: dist/world_address_sorting_engine-*.whl
          if-no-files-found: error

  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[excel,gui,packaging,test]"
      - run: python -m pytest -q
      - run: python -m compileall -q src tools
      - name: Build and test actual offline Country Code GUI
        run: python tools/package_windows.py --output dist-windows --onefile --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: country-analysis-windows-exe
          path: dist-windows/WorldAddressEngine.exe
          if-no-files-found: error
